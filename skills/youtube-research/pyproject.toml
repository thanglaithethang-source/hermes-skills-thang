[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-research"
version = "1.0.0"
description = "Drift-aware YouTube public research collectors and analytics"
readme = "SKILL.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "types-requests>=2.32,<3",
  "build>=1.2,<2",
]

[project.scripts]
youtube-research = "youtube_research.youtube_research:main"

[tool.setuptools]
include-package-data = false
packages = ["youtube_research", "youtube_research.references"]

[tool.setuptools.package-dir]
youtube_research = "scripts"
"youtube_research.references" = "references"

[tool.setuptools.package-data]
"youtube_research.references" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "live: opt-in live InnerTube contract tests",
]
filterwarnings = [
  "error::DeprecationWarning:youtube_research.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "scripts.analytics_estimate",
  "scripts.browse_suggested",
  "scripts.channel",
  "scripts.innertube",
  "scripts.report",
  "scripts.storage",
  "scripts.tracking",
  "scripts.video",
  "scripts.youtube_research",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["arg-type", "assignment", "attr-defined", "index", "var-annotated"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
fail_under = 90
