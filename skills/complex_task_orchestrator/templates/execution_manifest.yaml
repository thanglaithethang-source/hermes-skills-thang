# EXECUTION MANIFEST TEMPLATE
# Quản lý toàn bộ lifecycle của một task complex (LEVEL 3).
# Hermes cha tạo và duy trì file này. Sub-agent chỉ đọc phần liên quan.

project_name: ""
complexity_level: LEVEL_3  # LEVEL_1 | LEVEL_2 | LEVEL_3
created_at: ""
last_updated: ""

# === TASK CONTRACT (tham chiếu) ===
task_contract_ref: "templates/task_contract.yaml"

# === TASK GRAPH ===
tasks:
  - task_id: T00
    title: ""
    objective: ""
    inputs: []
    dependencies: []                    # task_id list
    owned_resources:
      - path: ""
        mode: read                     # read | write
    allowed_tools: []                  # terminal, file, web, browser, etc.
    forbidden_actions: []
    acceptance_criteria: []
    output_schema:
      type: object
      properties: {}
    # Tool routing record (per task)
    required_capability: ""            # Năng lực cần thiết
    selected_tool: ""                  # Tool được chọn
    selection_reason: ""               # Lý do chọn
    fallback_tool: ""                  # Tool dự phòng
    permissions: ""                   # Quyền: read-only, read+write
    side_effects: ""                   # Tác dụng phụ: modifies files, runs tests
    verification_method: ""            # Cách kiểm tra kết quả
    priority: HIGH                     # LOW | MEDIUM | HIGH | CRITICAL
    risk_level: LOW                    # LOW | MEDIUM | HIGH
    execution_mode: SEQUENTIAL         # SEQUENTIAL | PARALLEL_SAFE | APPROVAL_REQUIRED
    assigned_role: PLANNER             # PLANNER | RESEARCHER | EXECUTOR | TESTER | INTEGRATOR | AUDITOR | REPAIRER
    status: PENDING                    # PENDING | RUNNING | PASS | FAIL | BLOCKED | CANCELLED
    assigned_to: ""                    # delegate_task handle hoặc "hermes" (tự làm)
    result: {}                         # Output schema từ sub-agent
    repair_attempts: 0
    max_repair_attempts: 3

  - task_id: T01
    title: "Sample approval-required task"
    objective: "Delete production data (requires user approval)"
    inputs: []
    dependencies: [T00]
    owned_resources:
      - path: "production/**"
        mode: write
    allowed_tools: [terminal]
    forbidden_actions: ["rm -rf"]
    acceptance_criteria:
      - "User has approved the deletion"
    output_schema:
      type: object
      properties: {}
    priority: CRITICAL
    risk_level: HIGH
    execution_mode: APPROVAL_REQUIRED
    assigned_role: EXECUTOR
    status: PENDING
    assigned_to: ""
    result: {}
    repair_attempts: 0
    max_repair_attempts: 3

# === WAVE SCHEDULE ===
waves:
  - wave_id: 0
    name: "Intake & Environment Check"
    tasks: [T00]
    status: PENDING                     # PENDING | RUNNING | COMPLETE | BLOCKED
    gate: none                          # none | approval | integration
    depends_on: []

  - wave_id: 1
    name: "Research & Analysis"
    tasks: []
    status: PENDING
    gate: none
    depends_on: [0]

  - wave_id: 2
    name: "Independent Module Execution"
    tasks: []
    status: PENDING
    gate: none
    depends_on: [1]

  - wave_id: 3
    name: "Integration"
    tasks: []
    status: PENDING
    gate: integration
    depends_on: [2]

  - wave_id: 4
    name: "Integration Testing"
    tasks: []
    status: PENDING
    gate: none
    depends_on: [3]

  - wave_id: 5
    name: "Audit & Repair"
    tasks: []
    status: PENDING
    gate: approval
    depends_on: [4]

  - wave_id: 6
    name: "Final Verification"
    tasks: []
    status: PENDING
    gate: none
    depends_on: [5]

# === RESOURCE OWNERSHIP MAP ===
# Đảm bảo không hai writer cùng ghi một resource
resource_ownership:
  "path/to/resource/**":
    writer: T01                         # task_id duy nhất có quyền write
    readers: [T02, T03]                # task_id list có quyền read

# === CONFLICT LOG ===
conflicts: []

# === REPAIR LOG ===
repairs:
  - task_id: ""
    original_error: ""
    root_cause: ""
    strategy_used: ""
    attempt: 1
    result: ""                          # PASS | FAIL
    evidence: ""

# === INTEGRATION STATE ===
integration:
  integrator: "hermes"                 # luôn một integrator duy nhất
  merged_artifacts: []
  integration_tests_run: []
  integration_test_results: []
  regressions_found: []

# === AUDIT STATE ===
audit:
  auditor: ""                          # task_id hoặc "hermes"
  criteria_checked: []
  fail_list: []
  frozen: false                        # true khi fail_list đã đóng băng
  repair_tasks_created: []
  final_status: ""                     # PASS | FAIL

# === BLOCKERS ===
blockers:
  - task_id: ""
    description: ""
    evidence: ""
    escalated: false

# === STOP CONDITIONS ===
stop_conditions:
  - "Circular dependency detected in task graph"
  - "User revoked approval"
  - "Critical resource unavailable"
  - "Max repair attempts exceeded without resolution"

# === ASSUMPTIONS ===
assumptions:
  - assumption: ""
    basis: ""
    affects_tasks: []
